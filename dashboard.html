<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSight Analytics Dashboard</title>
    <!-- Tailwind CSS for sleek UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <h1 class="text-xl font-bold text-indigo-400 tracking-wider">👁️ OMNISIGHT // OBSERVABILITY</h1>
            <span class="bg-green-500/10 text-green-400 text-xs px-2.5 py-1 rounded-full font-medium border border-green-500/20">System Live</span>
        </div>
    </nav>

    <!-- Main Content Layout -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Metric Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Total Incidents</p>
                <p id="total-errors" class="text-4xl font-bold text-white mt-2">0</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Unique Projects</p>
                <p id="unique-projects" class="text-4xl font-bold text-indigo-400 mt-2">0</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-sm">
                <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Active Endpoints</p>
                <p class="text-4xl font-bold text-emerald-400 mt-2">1</p>
            </div>
        </div>

        <!-- Live Log Stream -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Live Incident Stream</h2>
                <button onclick="fetchMetrics()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded transition">Refresh Feed</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/50 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="py-3 px-6">Timestamp</th>
                            <th class="py-3 px-6">Project ID</th>
                            <th class="py-3 px-6">Error Message</th>
                            <th class="py-3 px-6">File & Line</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="divide-y divide-gray-700 text-sm">
                        <!-- Dynamic rows will inject here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Dashboard Logic Setup -->
    <script>
        async function fetchMetrics() {
            try {
                const response = await fetch('https://omnisight-backend.onrender.com/api/metrics');
                const result = await response.json();
                const data = result.data;

                // Update UI Metric Cards
                document.getElementById('total-errors').innerText = data.length;
                
                const uniqueIds = [...new Set(data.map(item => item.project_id))];
                document.getElementById('unique-projects').innerText = uniqueIds.length;

                // Populate Log Table
                const tableBody = document.getElementById('log-table-body');
                tableBody.innerHTML = ''; // Clear previous data

                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-gray-500">No telemetry data recorded yet.</td></tr>`;
                    return;
                }

                data.forEach(log => {
                    const date = new Date(log.timestamp).toLocaleTimeString();
                    const row = `
                        <tr class="hover:bg-gray-700/30 transition">
                            <td class="py-4 px-6 text-gray-400 font-mono">${date}</td>
                            <td class="py-4 px-6 font-semibold text-indigo-300">${log.project_id}</td>
                            <td class="py-4 px-6 text-red-400 font-mono font-medium">${log.message}</td>
                            <td class="py-4 px-6 text-gray-300 font-mono text-xs">${log.source.split('/').pop()}:${log.lineno}</td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });

            } catch (error) {
                console.error('Error updating dashboard:', error);
            }
        }

        // Auto-refresh the dashboard UI metrics every 5 seconds
        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
